services:
  agent:
    build: .
    env_file: .env
    ports:
      # только с этой машины: снаружи сервис доступен через прокси (Caddy). Открытый порт дает обойти лимит
      # частоты поддельным X-Forwarded-For
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/srv/data
    restart: unless-stopped
